<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MagicCon">
<link rel="apple-touch-icon" sizes="180x180" href="icons/magiccon-tracker-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/magiccon-tracker-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/magiccon-tracker-192.png">
<title>MagicCon Tracker</title>
<style>
:root{
  --bg:#0b1014; --surface:#121a21; --surface2:#18232c; --line:#22303b;
  --text:#e8f1f5; --muted:#8aa0ad; --accent:#00E5FF; --accent-ink:#00313a;
  --ok:#34d399; --sent:#a78bfa; --skip:#64748b; --warn:#f87171;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(11,16,20,.94);backdrop-filter:blur(10px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
h1 img{width:30px;height:30px;border-radius:8px;box-shadow:0 0 0 1px rgba(0,229,255,.35)}
h1 span{color:var(--accent)}
h1 b{font-weight:700}
.stats{font-size:13px;color:var(--muted);white-space:nowrap}
.stats b{color:var(--text)}
.search{margin-top:10px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:6px 16px}
.day{margin:22px 0 6px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.slot{margin:14px 0 6px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.live{background:var(--ok);color:#04261a;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.5px}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0;cursor:pointer}
.card.target{border-color:rgba(0,229,255,.45)}
.star{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:18px;line-height:1}
.star.on{color:var(--accent);border-color:var(--accent)}
.info{flex:1;min-width:0}
.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.s1{color:var(--text)}
.pill.s2{color:var(--accent);border-color:var(--accent)}
.pill.s3{color:var(--sent);border-color:var(--sent)}
.pill.s4{color:var(--ok);border-color:var(--ok)}
.pill.s5{color:var(--skip)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.ig{flex:0 0 auto;width:40px;height:36px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:var(--surface2);font:800 13px/34px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;text-decoration:none;letter-spacing:.3px}
.ig:active{background:var(--accent);color:var(--accent-ink)}
.ig-none{flex:0 0 auto;width:40px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(11,16,20,.96);border-top:1px solid var(--line)}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;font-weight:650}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
dialog{width:min(560px,100%);max-height:92vh;margin:auto auto 0;padding:0;border:1px solid var(--line);border-radius:18px 18px 0 0;background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.6)}
@media (min-width:600px){dialog{margin:auto;border-radius:18px}}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 2px;font-size:20px}
.sheet .when{color:var(--muted);font-size:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=url],input[type=date],select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
textarea{min-height:84px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:var(--text)}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.row{display:flex;gap:10px}
.row>div{flex:1}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1 1 45%}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.blurb{font-size:14px;color:var(--text);margin:2px 0 10px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.links a{font-size:13px;font-weight:650;color:var(--accent);text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unv{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><img src="icons/magiccon-tracker-64.png" alt=""><b>MagicCon <span>ATL</span></b></h1>
    <div class="stats" id="stats"></div>
  </div>
  <input class="search" id="q" type="search" placeholder="Search creators" autocomplete="off">
  <div class="chips" id="chips">
    <button class="chip" data-v="now">Now and next</button>
    <button class="chip" data-v="targets">Targets</button>
    <button class="chip" data-v="all">All</button>
    <button class="chip" data-v="met">Met</button>
    <button class="chip" data-v="follow">Follow up</button>
  </div>
</header>

<main id="list"></main>

<div class="bar">
  <button class="btn primary" id="addBtn">+ Add person</button>
  <button class="btn" id="backupBtn">Backup</button>
</div>

<dialog id="detail"><form method="dialog" class="sheet" id="detailForm"></form></dialog>

<dialog id="backup">
  <form method="dialog" class="sheet">
    <h2>Backup</h2>
    <div class="when">Your notes are saved on this phone and nowhere else. Export a backup at the end of each day.</div>
    <div class="actions">
      <button type="button" class="btn" id="expJson">Export backup</button>
      <button type="button" class="btn" id="expCsv">Export CSV</button>
      <button type="button" class="btn" id="impJson">Import backup</button>
      <button class="btn">Close</button>
    </div>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
  </form>
</dialog>

<div class="toast" id="toast"></div>

var DEFAULT_TARGETS = ["zbexx","zabracus","magicstory"];

var STATUSES = ["Not yet","Said hi","Filmed","Clip sent","Posted","Skipped"];
var BITS = ["","Card that represents you","Guess the win rate","Pick your fighter","Price check","Just said hi"];
var KEY = "stoken-magiccon-atl-2026-v1";

function tz(day,hm){ return new Date(DAYS[day].date+"T"+hm+":00-05:00"); }
function fmt(hm){ var p=hm.split(":"),h=+p[0],m=p[1]; return (h%12||12)+":"+m+(h<12?" am":" pm"); }

var creators = [];
SLOTS.forEach(function(s){
  s[3].forEach(function(c){
    creators.push({id:c[0],name:c[1],guests:c[2],day:s[0],start:s[1],end:s[2]});
  });
});

var state = load();
function blankState(){
  var t={}; DEFAULT_TARGETS.forEach(function(id){t[id]=true;});
  return {targets:t,records:{},custom:[]};
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var s=JSON.parse(raw); if(s&&s.records) { s.targets=s.targets||{}; s.custom=s.custom||[]; return s; } }
  }catch(e){}
  return blankState();
}
var storageOk = true;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); storageOk=true; }
  catch(e){ if(storageOk) toast("Could not save on this browser. Export a backup."); storageOk=false; }
}

function all(){ return creators.concat(state.custom.map(function(c){ return Object.assign({custom:true},c); })); }
function rec(id){ return state.records[id] || {}; }
function igList(id){
  var r=rec(id);
  if(r.ig){ return r.ig.split(/[\s,]+/).map(function(h){ return h.replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/[\/?#].*$/,""); }).filter(Boolean); }
  return (INFO[id]&&INFO[id].ig)||[];
}
function igUrl(h){ return "https://www.instagram.com/"+encodeURIComponent(h)+"/"; }
function statusIdx(id){ return +(rec(id).status||0); }

var view = "targets", query = "";
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }

function matches(c){
  if(!query) return true;
  var i=INFO[c.id]||{};
  var hay=(c.name+" "+(c.guests||[]).join(" ")+" "+(rec(c.id).handle||i.h||"")+" "+igList(c.id).join(" ")+" "+(i.b||"")+" "+(rec(c.id).card||"")).toLowerCase();
  return hay.indexOf(query)>-1;
}

function cardHtml(c){
  var r=rec(c.id), si=statusIdx(c.id), isT=!!state.targets[c.id];
  var i=INFO[c.id]||{};
  var sub = c.custom ? "Met on the floor" : (i.b || ((c.guests&&c.guests.length&&c.guests.join(", ")!==c.name)? c.guests.join(", ") : fmt(c.start)+" to "+fmt(c.end)));
  var h = r.handle || i.h;
  if(h) sub = h + "  ·  " + sub;
  return '<div class="card'+(isT?' target':'')+'" data-id="'+esc(c.id)+'">'+
    '<button class="star'+(isT?' on':'')+'" data-star="'+esc(c.id)+'" aria-label="Toggle target">'+(isT?'★':'☆')+'</button>'+
    '<div class="info"><div class="name">'+esc(c.name)+((INFO[c.id]&&INFO[c.id].v===false)?'<span class="unv">UNVERIFIED</span>':'')+'</div><div class="sub">'+esc(sub)+'</div></div>'+
    '<span class="pill s'+si+'">'+STATUSES[si]+'</span>'+
    (function(){ var g=igList(c.id); return g.length ? '<a class="ig" href="'+igUrl(g[0])+'" target="_blank" rel="noopener" aria-label="Open '+esc(c.name)+' on Instagram (@'+esc(g[0])+')">IG</a>' : '<span class="ig-none"></span>'; })()+
    '</div>';
}

function render(){
  document.querySelectorAll(".chip").forEach(function(b){ b.classList.toggle("on", b.dataset.v===view); });
  var list = all().filter(matches);
  var now = new Date(), html = "";

  if(view==="targets") list = list.filter(function(c){ return state.targets[c.id]; });
  if(view==="met") list = list.filter(function(c){ var s=statusIdx(c.id); return s>=1 && s<=4; });
  if(view==="follow") list = list.filter(function(c){ var s=statusIdx(c.id); return s===1 || s===2; });

  if(view==="now"){
    var sched = list.filter(function(c){ return !c.custom; });
    var liveEnds = {}, live = sched.filter(function(c){ return now>=tz(c.day,c.start) && now<tz(c.day,c.end); });
    var upcoming = sched.filter(function(c){ return tz(c.day,c.start)>now; }).sort(function(a,b){ return tz(a.day,a.start)-tz(b.day,b.start); });
    var nextKey = upcoming.length ? upcoming[0].day+upcoming[0].start : null;
    var next = upcoming.filter(function(c){ return c.day+c.start===nextKey; });
    var byT = function(a,b){ return (state.targets[b.id]?1:0)-(state.targets[a.id]?1:0); };
    if(live.length){ html += '<div class="slot"><span class="live">LIVE</span> '+DAYS[live[0].day].label+', until '+fmt(live[0].end)+'</div>' + live.sort(byT).map(cardHtml).join(""); }
    if(next.length){ html += '<div class="slot">Up next: '+DAYS[next[0].day].label+', '+fmt(next[0].start)+'</div>' + next.sort(byT).map(cardHtml).join(""); }
    if(!html) html = '<div class="empty">Nothing live or coming up. MagicCon is over.</div>';
    $("list").innerHTML = html; stats(); return;
  }

  var sched = list.filter(function(c){ return !c.custom; });
  var custom = list.filter(function(c){ return c.custom; });
  var lastDay=null, lastSlot=null;
  sched.forEach(function(c){
    if(c.day!==lastDay){ html += '<div class="day">'+DAYS[c.day].label+'</div>'; lastDay=c.day; lastSlot=null; }
    var sk=c.day+c.start;
    if(sk!==lastSlot){
      var isLive = now>=tz(c.day,c.start) && now<tz(c.day,c.end);
      html += '<div class="slot">'+(isLive?'<span class="live">LIVE</span> ':'')+fmt(c.start)+' to '+fmt(c.end)+'</div>'; lastSlot=sk;
    }
    html += cardHtml(c);
  });
  if(custom.length){ html += '<div class="day">Met on the floor</div>' + custom.map(cardHtml).join(""); }
  if(!html) html = '<div class="empty">'+(view==="targets"?"No targets yet. Tap ☆ on anyone in All.":"Nobody here yet.")+'</div>';
  $("list").innerHTML = html;
  stats();
}

function stats(){
  var everyone = all(), t = everyone.filter(function(c){ return state.targets[c.id]; });
  var tMet = t.filter(function(c){ var s=statusIdx(c.id); return s>=1&&s<=4; }).length;
  var met = everyone.filter(function(c){ var s=statusIdx(c.id); return s>=1&&s<=4; }).length;
  var sent = everyone.filter(function(c){ return statusIdx(c.id)>=3 && statusIdx(c.id)<=4; }).length;
  $("stats").innerHTML = "Targets <b>"+tMet+"/"+t.length+"</b> · Met <b>"+met+"</b> · Sent <b>"+sent+"</b>";
}

function find(id){ return all().filter(function(c){ return c.id===id; })[0]; }

function openDetail(id){
  var c = find(id); if(!c) return;
  var r = rec(id);
  var opts = function(arr,sel){ return arr.map(function(v,i){ return '<option value="'+i+'"'+(+sel===i?' selected':'')+'>'+esc(v||"Choose a bit")+'</option>'; }).join(""); };
  var when = c.custom ? "Met on the floor" : DAYS[c.day].label+", "+fmt(c.start)+" to "+fmt(c.end)+" · Creator Central";
  var i = INFO[c.id]||{};
  var guests = (c.guests&&c.guests.length) ? '<div class="hint">At the table: '+esc(c.guests.join(", "))+'</div>' : '';
  var safe = function(u){ return /^https?:\/\//i.test(u||"") ? u : ""; };
  var igHtml = igList(c.id).map(function(h){ return '<a href="'+igUrl(h)+'" target="_blank" rel="noopener">Instagram @'+esc(h)+'</a>'; }).join("");
  var linkHtml = igHtml + [r.link||i.l, i.l2].filter(function(u,k,a){ return safe(u) && a.indexOf(u)===k; }).map(function(u){
    return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https?:\/\/(www\.)?/i,"").replace(/\/$/,""))+'</a>'; }).join("");
  var about = (i.b ? '<div class="blurb">'+esc(i.b)+'</div>' : '') +
    (i.v===false ? '<div class="hint" style="color:var(--warn)">Unverified. I cannot verify this.'+(i.n?' '+esc(i.n)+'.':'')+'</div>' : '') +
    (linkHtml ? '<div class="links">'+linkHtml+'</div>' : '');
  $("detailForm").innerHTML =
    (c.custom ? '<label>Name</label><input type="text" id="f_name" value="'+esc(c.name)+'">' : '<h2>'+esc(c.name)+'</h2>')+
    '<div class="when">'+esc(when)+'</div>'+about+guests+
    '<label>Status</label><select id="f_status">'+opts(STATUSES,r.status||0)+'</select>'+
    '<label>Handle(s)</label><input type="text" id="f_handle" placeholder="@handle" value="'+esc(r.handle!=null?r.handle:(i.h||""))+'" autocapitalize="off" autocorrect="off">'+
    '<label>Instagram</label><input type="text" id="f_ig" placeholder="@handle" value="'+esc(r.ig!=null?r.ig:igList(c.id).map(function(h){return "@"+h;}).join(", "))+'" autocapitalize="off" autocorrect="off">'+
    '<label>Profile link</label><input type="url" id="f_link" placeholder="https://" value="'+esc(r.link!=null?r.link:(i.l||""))+'" autocapitalize="off">'+
    '<label>Bit</label><select id="f_bit">'+opts(BITS,r.bit||0)+'</select>'+
    '<label>Their card or answer</label><input type="text" id="f_card" value="'+esc(r.card)+'">'+
    '<label class="check"><input type="checkbox" id="f_consent"'+(r.consent?' checked':'')+'> Said yes to being filmed</label>'+
    '<div class="row"><div><label>Clip file</label><input type="text" id="f_clip" placeholder="IMG_0412" value="'+esc(r.clip)+'"></div>'+
    '<div><label>Next touch</label><input type="date" id="f_next" value="'+esc(r.next)+'"></div></div>'+
    '<div class="row"><div><label>Clip sent</label><input type="date" id="f_sent" value="'+esc(r.sent)+'"></div>'+
    '<div><label>Posted</label><input type="date" id="f_posted" value="'+esc(r.posted)+'"></div></div>'+
    '<label>Notes</label><textarea id="f_notes" placeholder="What you talked about. Something to bring up next time.">'+esc(r.notes)+'</textarea>'+
    '<div class="actions">'+
      '<button type="button" class="btn" id="copyDm">Copy follow-up</button>'+
      '<button type="button" class="btn" id="toggleStar">'+(state.targets[id]?'Remove target':'Make target')+'</button>'+
      (c.custom?'<button type="button" class="btn danger" id="delCustom">Delete</button>':'')+
      '<button type="button" class="btn primary" id="saveBtn">Save</button>'+
    '</div>';
  var d=$("detail");
  $("saveBtn").onclick = function(){ commit(id,c); d.close(); toast("Saved"); };
  $("toggleStar").onclick = function(){ commit(id,c); toggleTarget(id); d.close(); };
  $("copyDm").onclick = function(){ commit(id,c); copy(followUp(id)); };
  if(c.custom) $("delCustom").onclick = function(){
    if(!confirm("Delete "+c.name+"? This cannot be undone.")) return;
    state.custom = state.custom.filter(function(x){ return x.id!==id; });
    delete state.records[id]; delete state.targets[id]; save(); d.close(); render();
  };
  d.showModal();
}

function commit(id,c){
  var v = function(k){ return $("f_"+k).value.trim(); };
  var r = {
    status:+$("f_status").value, handle:v("handle"), link:v("link"), bit:+$("f_bit").value,
    card:v("card"), ig:v("ig"), consent:$("f_consent").checked, clip:v("clip"), next:v("next"),
    sent:v("sent"), posted:v("posted"), notes:$("f_notes").value.trim()
  };
  if(r.sent && r.status<3) r.status=3;
  if(r.posted) r.status=4;
  r.updated = new Date().toISOString();
  state.records[id]=r;
  if(c.custom){ var n=v("name"); if(n){ state.custom.forEach(function(x){ if(x.id===id) x.name=n; }); } }
  save(); render();
}

function followUp(id){
  var c=find(id), r=rec(id), first=(c.guests&&c.guests.length===1?c.guests[0]:c.name);
  var bit = BITS[r.bit||0] ? ' from the "'+BITS[r.bit].toLowerCase()+'" bit' : '';
  var cardLine = r.card ? ' Still thinking about your '+r.card+' pick.' : '';
  return "Hey "+first+", great meeting you at MagicCon Atlanta. Here's your clip"+bit+", yours to use however you want."+cardLine+" I'm posting it on @stokengames soon and will tag you.";
}

function toggleTarget(id){ if(state.targets[id]) delete state.targets[id]; else state.targets[id]=true; save(); render(); }

function addPerson(){
  var name = prompt("Who did you meet?");
  if(!name || !name.trim()) return;
  var id = "custom-"+Date.now();
  state.custom.push({id:id,name:name.trim(),guests:[]});
  state.records[id]={status:1,updated:new Date().toISOString()};
  save(); if(view==="targets"||view==="now") view="met"; render(); openDetail(id);
}

function download(name,text,type){
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type}));
  a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function stamp(){ return new Date().toISOString().slice(0,16).replace(/[:T]/g,"-"); }
function exportJson(){ download("magiccon-tracker-"+stamp()+".json", JSON.stringify(state,null,2), "application/json"); }
function exportCsv(){
  var cols=["name","day","time","target","status","handle","instagram","link","bit","card","consent","clip","sent","posted","next","notes"];
  var q=function(s){ s=String(s==null?"":s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  var rows=[cols.join(",")];
  all().forEach(function(c){
    var r=rec(c.id), si=statusIdx(c.id);
    if(si===0 && !state.targets[c.id]) return;
    rows.push([c.name, c.custom?"":DAYS[c.day].label, c.custom?"":fmt(c.start), state.targets[c.id]?"yes":"", STATUSES[si], r.handle||(INFO[c.id]||{}).h, igList(c.id).map(function(h){return '@'+h;}).join(' '), r.link||(INFO[c.id]||{}).l, BITS[r.bit||0], r.card, r.consent?"yes":"", r.clip, r.sent, r.posted, r.next, r.notes].map(q).join(","));
  });
  download("magiccon-tracker-"+stamp()+".csv", rows.join("\n"), "text/csv");
}
function importJson(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var s=JSON.parse(fr.result);
      if(!s || typeof s.records!=="object") throw 0;
      if(!confirm("Replace what's on this phone with the backup?")) return;
      state={targets:s.targets||{},records:s.records,custom:s.custom||[]}; save(); render(); $("backup").close(); toast("Backup restored");
    }catch(e){ toast("That file isn't a tracker backup"); }
  };
  fr.readAsText(file);
}

function copy(text){
  var done=function(){ toast("Follow-up copied"); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,function(){ fallback(); }); }
  else fallback();
  function fallback(){ var t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy"); done();}catch(e){ prompt("Copy this:",text); } t.remove(); }
}

var tt;
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove("show"); },1800); }

$("chips").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(b){ view=b.dataset.v; render(); window.scrollTo(0,0); } });
$("q").addEventListener("input",function(){ query=this.value.trim().toLowerCase(); render(); });
$("list").addEventListener("click",function(e){
  if(e.target.closest("a.ig")) return;
  var s=e.target.closest("[data-star]"); if(s){ e.stopPropagation(); toggleTarget(s.dataset.star); return; }
  var c=e.target.closest(".card"); if(c) openDetail(c.dataset.id);
});
$("addBtn").onclick=addPerson;
$("backupBtn").onclick=function(){ $("backup").showModal(); };
$("expJson").onclick=exportJson;
$("expCsv").onclick=exportCsv;
$("impJson").onclick=function(){ $("impFile").click(); };
$("impFile").onchange=function(){ if(this.files[0]) importJson(this.files[0]); this.value=""; };

var t0=new Date();
if(t0>=tz("fri","08:00") && t0<tz("sun","16:30")) view="now";
render();
setInterval(function(){ if(view==="now") render(); },60000);
})();
</script>
</body>
</html>
